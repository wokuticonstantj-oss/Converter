<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wokuti Pro Dashboard</title>
    <style>
        :root { --primary: #007bff; --secondary: #ff9800; --bg: #f4f7f6; --text: #333; }
        body.dark { --bg: #1a1a2e; --text: #fff; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg); 
            color: var(--text);
            transition: background 0.5s ease; /* Smooth background transition */
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; 
        }

        .card { 
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px); /* Modern frosted glass effect */
            padding: 2rem; border-radius: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            width: 320px; text-align: center; border: 1px solid rgba(255,255,255,0.2);
            animation: fadeIn 1s ease-in; 
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        input { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 12px; border: none; font-size: 1.2rem; outline: none; }
        
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .to-f { background-color: var(--primary); }
        .to-c { background-color: var(--secondary); }
        button:hover { filter: brightness(1.2); transform: translateY(-2px); }

        #result { margin-top: 25px; font-size: 2rem; font-weight: bold; transition: 0.3s; }
        .animate-res { animation: pop 0.4s ease; }
        
        .mode-toggle { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 1.5rem; }
    </style>
</head>
<body>

<div class="mode-toggle" onclick="toggleTheme()">🌓</div>

<div class="card">
    <h2>Smart Converter</h2>
    <input type="number" id="tempInput" placeholder="Enter degree">
    
    <div class="btn-group">
        <button class="to-f" onclick="convert('F')">To °F</button>
        <button class="to-c" onclick="convert('C')">To °C</button>
    </div>

    <div id="result">---</div>
</div>

<script>
    function toggleTheme() { document.body.classList.toggle('dark'); }

    function convert(unit) {
        const input = document.getElementById('tempInput').value;
        const display = document.getElementById('result');
        
        if (input === "") return;

        display.classList.remove('animate-res'); // Reset animation
        void display.offsetWidth; // Trigger reflow
        display.classList.add('animate-res'); // Start animation

        let res = (unit === 'F') ? (input * 9/5) + 32 : (input - 32) * 5/9;
        display.innerText = res.toFixed(1) + (unit === 'F' ? " °F" : " °C");
        
        // Logical color change: Red for hot, Blue for cold
        display.style.color = (res > 30 && unit === 'C') || (res > 86 && unit === 'F') ? "#ff4d4d" : "#4d94ff";
    }
</script>

</body>
</html>
