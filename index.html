<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermo-Tech Pro</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 90%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 15px; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 8px; font-size: 1.2rem; box-sizing: border-box; }
        .buttons { display: flex; gap: 10px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .btn-f { background: #007bff; }
        .btn-c { background: #ff9800; }
        #result { margin-top: 20px; font-size: 1.5rem; font-weight: bold; color: #28a745; }
    </style>
</head>
<body>

<div class="card">
    <h2>Thermo-Tech Pro</h2>
    <input type="number" id="tempInput" placeholder="Enter number here">
    <div class="buttons">
        <button class="btn-f" onclick="convert('F')">To °F</button>
        <button class="btn-c" onclick="convert('C')">To °C</button>
    </div>
    <div id="result">---</div>
</div>

<script>
    function convert(unit) {
        const val = document.getElementById('tempInput').value;
        const resDisp = document.getElementById('result');
        if (val === "") { resDisp.innerText = "Enter a number!"; return; }
        
        if (unit === 'F') {
            let f = (val * 9/5) + 32;
            resDisp.innerText = f.toFixed(2) + " °F";
        } else {
            let c = (val - 32) * 5/9;
            resDisp.innerText = c.toFixed(2) + " °C";
        }
    }
</script>

</body>
</html>
