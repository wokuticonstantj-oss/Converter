                                                                                                    </html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulanga SS - Marks Entry</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f7; padding: 15px; margin: 0; }
        .card { max-width: 450px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin: 20px auto; }
        h2 { color: #1a73e8; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #1a73e8; padding-bottom: 10px; }
        label { display: block; margin: 15px 0 5px; font-weight: 600; color: #444; }
        input, select { width: 100%; padding: 12px; margin-bottom: 5px; border: 1px solid #cbd5e0; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 20px; transition: 0.3s; }
        button:active { background: #1152a8; transform: scale(0.98); }
        .status { text-align: center; margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 5px; }
        .loading { color: #1a73e8; background: #e8f0fe; }
        .success { color: #1e7e34; background: #d4edda; }
    </style>
</head>
<body>

<div class="card">
    <h2>Bulanga SS Database</h2>
    
    <label>Student Full Name</label>
    <input type="text" id="studentName" placeholder="e.g. Musoke Peter">

    <label>Class</label>
    <select id="studentClass">
        <option>Senior 1</option>
        <option>Senior 2</option>
        <option>Senior 3</option>
        <option>Senior 4</option>
    </select>

    <label>Subject</label>
    <select id="teacherSubject">
        <option value="math">Mathematics</option>
        <option value="eng">English</option>
        <option value="bio">Biology</option>
        <option value="phy">Physics</option>
        <option value="chem">Chemistry</option>
        <option value="hist">History</option>
        <option value="geo">Geography</option>
        <option value="comm">Commerce</option>
    </select>

    <label>Enter Mark (0-100)</label>
    <input type="number" id="marks" placeholder="Enter Score">

    <button onclick="syncData()">Save to Cloud</button>
    <div id="statusMsg" class="status" style="display:none;"></div>
</div>

<script>
    // YOUR SECURE CLOUD BRIDGE
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbxAR6cxNwqxU7SkixGyZZ39glMKrpq3UO8xCCdzwaJXpxsl6141IwJrinWIaLoQn8zIUQ/exec";

    async function syncData() {
        const name = document.getElementById('studentName').value;
        const cls = document.getElementById('studentClass').value;
        const sub = document.getElementById('teacherSubject').value;
        const score = document.getElementById('marks').value;
        const status = document.getElementById('statusMsg');

        if(!name || !score) {
            alert("⚠️ Please enter both Name and Marks!");
            return;
        }

        status.style.display = "block";
        status.className = "status loading";
        status.innerText = "⏳ Saving to Google Sheet...";

        try {
            await fetch(CLOUD_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({name, class: cls, subject: sub, score})
            });

            status.className = "status success";
            status.innerText = "✅ Successfully Saved!";
            
            // Reset mark field for next entry
            document.getElementById('marks').value = "";
            
            // Hide success message after 3 seconds
            setTimeout(() => { status.style.display = "none"; }, 3000);

        } catch (error) {
            status.style.background = "#f8d7da";
            status.style.color = "#721c24";
            status.innerText = "❌ Connection Error!";
        }
    }
</script>

</body>
    </html>
