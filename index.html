<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulanga SS Pro - Management System</title>
    <style>
        :root { --school-blue: #003366; --school-orange: #f39c12; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        
        /* Navigation & Header - Hidden during Printing */
        @media print {
            .nav, header, .main-btn, .action-area, .info-entry { display: none !important; }
            .content { padding: 0; margin: 0; width: 100%; }
            .card { box-shadow: none; border: none; width: 100%; }
            #reportDisplay { display: block !important; }
        }

        header { background: var(--school-blue); color: white; padding: 25px; text-align: center; border-bottom: 5px solid var(--school-orange); }
        header h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; }
        header p { margin: 5px 0 0; font-style: italic; font-size: 0.9rem; letter-spacing: 2px; }

        .nav { display: flex; background: white; sticky: top; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nav button { flex: 1; padding: 15px; border: none; background: none; font-weight: bold; cursor: pointer; transition: 0.3s; border-bottom: 3px solid transparent; }
        .nav button.active { color: var(--school-orange); border-bottom: 3px solid var(--school-orange); }

        .content { padding: 20px; max-width: 800px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
        
        /* Grid Layouts */
        .info-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; margin-bottom: 10px; }
        
        .main-btn { width: 100%; background: var(--school-blue); color: white; padding: 15px; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 10px; }
        .print-btn { background: #27ae60; margin-top: 10px; }

        /* Report Table */
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #000; padding: 10px; text-align: left; }
        th { background: #f2f2f2; }
        .summary { margin-top: 15px; padding: 15px; background: #eef7ff; border: 1px dashed var(--school-blue); border-radius: 8px; text-align: center; }
    </style>
</head>
<body>

<header>
    <h1>BULANGA SECONDARY SCHOOL</h1>
    <p>" PROGRESSIVE "</p>
</header>

<div class="nav">
    <button onclick="show('ana')" id="btn-ana" class="active">📊 Analyze</button>
    <button onclick="show('lib')" id="btn-lib">📚 Library</button>
    <button onclick="show('imp')" id="btn-imp">📥 Import</button>
</div>

<div class="content">
    <div id="ana" class="section">
        <div class="card info-entry">
            <h2>Teacher's Dashboard</h2>
            <div class="info-group">
                <input type="text" id="sName" placeholder="Student Name">
                <input type="text" id="sClass" placeholder="Class (e.g. S.4)">
            </div>
            <div class="subject-grid">
                <input type="number" id="sub1" placeholder="Math">
                <input type="number" id="sub2" placeholder="English">
                <input type="number" id="sub3" placeholder="Biology">
                <input type="number" id="sub4" placeholder="Physics">
                <input type="number" id="sub5" placeholder="Chemistry">
                <input type="number" id="sub6" placeholder="History">
                <input type="number" id="sub7" placeholder="Geography">
                <input type="number" id="sub8" placeholder="Commerce">
            </div>
            <button class="main-btn" onclick="generateReport()">Process Marks</button>
        </div>

        <div id="reportDisplay" class="card" style="display:none;">
            <div style="text-align:center;">
                <h2 style="margin:0; color:var(--school-blue);">BULANGA SECONDARY SCHOOL</h2>
                <p style="margin:5px 0;">Official Student Performance Report</p>
                <hr>
            </div>
            <div id="reportHeader"></div>
            <table>
                <thead><tr><th>Subject</th><th>Score</th><th>Grade</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
            <div id="summaryBox" class="summary"></div>
            
            <div class="action-area">
                <button class="main-btn print-btn" onclick="window.print()">🖨️ Print Report Card</button>
                <button class="main-btn" style="background:#8e44ad;" onclick="location.reload()">🔄 New Entry</button>
            </div>
        </div>
    </div>
</div>

<script>
    function show(id) {
        // Simple tab switcher logic
    }

    function getGrade(s) {
        if(s >= 80) return "D1"; if(s >= 75) return "D2"; if(s >= 65) return "C3";
        if(s >= 60) return "C4"; if(s >= 55) return "C5"; if(s >= 50) return "C6";
        if(s >= 45) return "P7"; if(s >= 40) return "P8"; return "F9";
    }

    function generateReport() {
        const name = document.getElementById('sName').value;
        const cls = document.getElementById('sClass').value;
        if(!name || !cls) return alert("Enter Student Info!");

        const subs = ["Math", "English", "Biology", "Physics", "Chemistry", "History", "Geography", "Commerce"];
        let total = 0;
        let rows = "";

        for(let i=1; i<=8; i++) {
            let s = Number(document.getElementById('sub' + i).value) || 0;
            total += s;
            rows += `<tr><td>${subs[i-1]}</td><td>${s}</td><td>${getGrade(s)}</td></tr>`;
        }

        const avg = total / 8;
        let div = avg >= 70 ? "Division 1" : avg >= 55 ? "Division 2" : avg >= 40 ? "Division 3" : "Division 4";

        document.getElementById('reportHeader').innerHTML = `<p><strong>Name:</strong> ${name.toUpperCase()} | <strong>Class:</strong> ${cls}</p>`;
        document.getElementById('tableBody').innerHTML = rows;
        document.getElementById('summaryBox').innerHTML = `<strong>AVERAGE: ${avg.toFixed(1)}% | RESULT: ${div}</strong>`;
        document.getElementById('reportDisplay').style.display = 'block';
    }
</script>
</body>
    </html>
